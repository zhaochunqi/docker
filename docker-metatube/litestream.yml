sync-interval: 10m

# v0.5 默认 15s 一次 L0 retention 检查，每次都对 S3 发 LIST（Class A），拉长到 1h
l0-retention-check-interval: 1h

snapshot:
  interval: 24h
  retention: 24h

levels:
  - interval: 24h
    retention: 168h

validation:
  interval: 24h

dbs:
  - path: /data/metatube.db
    replica:
      type: s3
      endpoint: https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      bucket: ${CLOUDFLARE_R2_BUCKET_NAME}
      path: metatube
      region: us-east-1
      access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
      secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
