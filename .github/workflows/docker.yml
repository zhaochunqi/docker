name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'docker-*/**'
  pull_request:
    branches:
      - main
    paths:
      - 'docker-*/**'
  workflow_dispatch:
    inputs:
      folders:
        description: 'Folders to build (comma separated, empty for all)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed folders
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.folders }}" != "" ]]; then
              MATRIX=$(echo "${{ github.event.inputs.folders }}" | jq -Rc 'split(",")')
            else
              MATRIX=$(for dir in docker-*/; do [ -d "$dir" ] && echo "${dir%/}" | sed 's/^docker-//'; done | jq -R . | jq -s -c .)
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            MATRIX=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '^docker-' | cut -d'/' -f1 | sed 's/^docker-//' | sort -u | jq -R . | jq -s -c .)
          else
            MATRIX=$(git diff --name-only HEAD~1 HEAD | grep '^docker-' | cut -d'/' -f1 | sed 's/^docker-//' | sort -u | jq -R . | jq -s -c .)
          fi
          
          if [ -z "$MATRIX" ] || [ "$MATRIX" == "null" ]; then
            MATRIX="[]"
          fi
          echo "Folders to build: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-push:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.matrix != '[]' && needs.build.outputs.matrix != '' }}
    strategy:
      matrix:
        folder: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.actor }}/${{ matrix.folder }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYY.MM.DD'}}

      - uses: docker/build-push-action@v5
        with:
          context: ./docker-${{ matrix.folder }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
