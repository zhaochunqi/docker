name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "docker-*/**"
  pull_request:
    branches:
      - main
    paths:
      - "docker-*/**"
  workflow_dispatch:
    inputs:
      folders:
        description: "Folders to build (comma separated, empty for all)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Detect changed folders
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.folders }}" != "" ]]; then
              MATRIX=$(echo "${{ github.event.inputs.folders }}" | jq -Rc 'split(",")')
            else
              MATRIX=$(for dir in docker-*/; do [ -d "$dir" ] && echo "${dir%/}" | sed 's/^docker-//'; done | jq -R . | jq -s -c .)
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            MATRIX=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '^docker-' | cut -d'/' -f1 | sed 's/^docker-//' | sort -u | jq -R . | jq -s -c .)
          else
            BEFORE="${{ github.event.before }}"
            if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              MATRIX=$(git diff --name-only HEAD~1 HEAD | grep '^docker-' | cut -d'/' -f1 | sed 's/^docker-//' | sort -u | jq -R . | jq -s -c .)
            else
              MATRIX=$(git diff --name-only "${BEFORE}" "${{ github.sha }}" | grep '^docker-' | cut -d'/' -f1 | sed 's/^docker-//' | sort -u | jq -R . | jq -s -c .)
            fi
          fi

          if [ -z "$MATRIX" ] || [ "$MATRIX" == "null" ]; then
            MATRIX="[]"
          fi
          echo "Folders to build: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-push:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.matrix != '[]' && needs.build.outputs.matrix != '' }}
    strategy:
      matrix:
        folder: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.folder }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYY.MM.DD'}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: ./docker-${{ matrix.folder }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xiaolutech/dispatch-my-services-image-ref
          ref: v1
          path: .dispatch-action

      - name: Resolve my-services targets
        id: targets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          case "${{ matrix.folder }}" in
            linkding)              list="linkding" ;;
            metatube)              list="metatube" ;;
            new-api)               list="new-api" ;;
            ntfy)                  list="ntfy" ;;
            freellmapi)            list="freellmapi" ;;
            git-sync)             list="git-sync" ;;
            traefik-cert-remover)  list="traefik-cert-remover" ;;
            traefik-cert-dumper)   list="traefik-cert-dumper" ;;
            *)                     list="" ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Dispatch image refs
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.targets.outputs.list != ''
        env:
          DISPATCH_TOKEN: ${{ secrets.MY_SERVICES_DISPATCH_TOKEN }}
          DISPATCH_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for target in ${{ steps.targets.outputs.list }}; do
            echo "Dispatching my-services update for target=${target}"
            DISPATCH_TARGET="$target" \
              bash .dispatch-action/scripts/dispatch-image-ref.sh
          done
