sync-interval: 15m

# v0.5 默认 15s 一次 L0 retention 检查，每次都对 S3 发 LIST（Class A），拉长到 1h
l0-retention-check-interval: 1h

snapshot:
  interval: 24h
  retention: 24h

levels:
  - interval: 24h
    retention: 168h

validation:
  interval: 24h

dbs:
  - path: /app/server/data/freeapi.db
    monitor-interval: 15s
    checkpoint-interval: 5m
    replicas:
      - type: s3
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH}
        region: us-east-1
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
